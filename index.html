<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="인문학과 윤리">
<meta name="description" content="인문학과 윤리 — 단원별 학습지와 형성평가">
<style>
:root{
  color-scheme:light dark;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{margin:0;padding:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>인문학과 윤리 학습실</title>

<!-- ───────────────────────────────────────────────────────────────
     외부 연결이 하나도 없습니다.
     글꼴·스크립트·이미지를 전부 이 파일 안에서 해결하므로,
     링크를 받은 학생이 로그인이나 설치 없이 열기만 하면 바로 쓸 수 있고
     CDN이 막혀 있어도 화면이 깨지지 않습니다.

     ※ 학습지와 똑같은 웹폰트(IBM Plex Sans KR / Noto Serif KR)를 쓰고 싶으시면
       아래 한 줄의 주석을 풀고, --sans / --serif 맨 앞에 폰트 이름을 넣으세요.
       (인터넷이 안 되는 곳에서는 시스템 글꼴로 자동 대체됩니다.)
     <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap">
     ─────────────────────────────────────────────────────────────── -->

<style>
/* ═══════════════════════════════════════════════════════════════
   디자인 토큰 — 보라(자수정) 계열 팔레트.
   색을 또 바꾸시려면 아래 세 블록(:root / 다크 2개)의 값만 고치면 됩니다.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --ink:#211F2B;          /* 본문 */
  --ink-2:#645F72;        /* 보조 */
  --ink-3:#8E89A0;        /* 흐린 글 */
  --line:#E4E0EB;         /* 선 */
  --line-2:#EFECF4;
  --bg:#F8F7FB;           /* 페이지 바닥 */
  --surface:#FFFFFF;      /* 카드 */
  --surface-2:#F2EFF7;    /* 카드 안쪽 면 */
  --accent:#5B3D8F;         /* 액센트 (자수정 보라) */
  --accent-deep:#452C71;
  --accent-soft:#EDE7F6;    /* 라벨면 */
  --quiz:#A5386B;         /* 형성평가 계열 (자주) */
  --quiz-soft:#FAEAF1;
  --ok:#1F6F4A;
  --ok-soft:#E7F1EB;
  --no:#B32318;
  --no-soft:#F8EBE9;
  --grad:linear-gradient(135deg,#2C1A4D 0%,#57388C 46%,#8257B0 100%);
  --shadow:0 1px 2px rgba(33,31,43,.05), 0 8px 24px -12px rgba(33,31,43,.20);
  --radius:14px;
  /* 시스템에 이미 있는 글꼴만 씁니다 — 내려받을 것이 없어 어디서나 즉시 뜹니다 */
  --sans:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","맑은 고딕",sans-serif;
  --serif:"Nanum Myeongjo","Apple Myungjo",Batang,"바탕",Georgia,serif;  /* 제시문 인용 전용 */
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"D2Coding","Courier New",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#EAE7F0; --ink-2:#A8A2B8; --ink-3:#7E788E;
    --line:#332F3F; --line-2:#282534;
    --bg:#141219; --surface:#1C1A24; --surface-2:#242130;
    --accent:#B79BE6; --accent-deep:#CDB8F2; --accent-soft:#2C2342;
    --quiz:#E294B8; --quiz-soft:#33202C;
    --ok:#6FC79A; --ok-soft:#16281F;
    --no:#E98A7E; --no-soft:#2C1B19;
    --grad:linear-gradient(135deg,#1A1030 0%,#2E1E52 46%,#453072 100%);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ink:#EAE7F0; --ink-2:#A8A2B8; --ink-3:#7E788E;
  --line:#332F3F; --line-2:#282534;
  --bg:#141219; --surface:#1C1A24; --surface-2:#242130;
  --accent:#B79BE6; --accent-deep:#CDB8F2; --accent-soft:#2C2342;
  --quiz:#E294B8; --quiz-soft:#33202C;
  --ok:#6FC79A; --ok-soft:#16281F;
  --no:#E98A7E; --no-soft:#2C1B19;
  --grad:linear-gradient(135deg,#1A1030 0%,#2E1E52 46%,#453072 100%);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:1020px;margin:0 auto;padding-inline:16px}

/* ── 헤더 ───────────────────────────────────────────────── */
.hero{background:var(--grad);color:#F4F1F9;position:relative;overflow:hidden}
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 82% -10%, rgba(255,255,255,.16), transparent 60%);
}
.hero-in{position:relative;z-index:1;padding-block:clamp(34px,7vw,58px)}
.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(244,241,249,.72);margin:0 0 14px;
}
.hero h1{
  font-family:var(--sans);font-weight:700;
  font-size:clamp(26px,5.4vw,44px);line-height:1.28;margin:0;text-wrap:balance;
  letter-spacing:-.01em;
}
.hero p{margin:14px 0 0;max-width:56ch;color:rgba(244,241,249,.86);font-weight:300}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.stat{
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);
  border-radius:999px;padding:5px 13px;font-size:12.5px;display:flex;gap:7px;align-items:baseline;
}
.stat b{font-family:var(--mono);font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums}

/* ── 툴바 ───────────────────────────────────────────────── */
.toolbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.6) blur(10px);
  border-bottom:1px solid var(--line);
}
.toolbar-in{display:flex;gap:10px;align-items:center;padding-block:11px;flex-wrap:wrap}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{
  width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:14px;
}
.search input::placeholder{color:var(--ink-3)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.tbtn{
  border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:9px 13px;font-size:13.5px;font-weight:500;white-space:nowrap;
  transition:border-color .15s,background .15s;
}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}

/* ── 대단원 아코디언 ────────────────────────────────────── */
main{padding-block:26px 64px}
.unit{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;
}
.unit > summary{
  list-style:none;cursor:pointer;display:flex;gap:14px;align-items:center;
  padding:17px 18px;transition:background .15s;
}
.unit > summary::-webkit-details-marker{display:none}
.unit > summary:hover{background:var(--surface-2)}
.unum{
  flex:0 0 auto;width:38px;height:38px;border-radius:10px;
  background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;
  font-family:var(--sans);font-weight:700;font-size:16px;
}
.uhead{flex:1;min-width:0}
.uhead h2{margin:0;font-size:16.5px;font-weight:600;letter-spacing:-.01em;line-height:1.4}
.uhead .umeta{margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}
.uchev{flex:0 0 auto;color:var(--ink-3);transition:transform .2s}
.unit[open] > summary .uchev{transform:rotate(180deg)}
.unit[open] > summary{border-bottom:1px solid var(--line-2)}
.ubody{padding:4px 18px 18px}

/* ── 중단원 ─────────────────────────────────────────────── */
.chapter{padding-top:18px}
.chapter + .chapter{margin-top:6px;border-top:1px dashed var(--line);}
.chead{display:flex;gap:9px;align-items:baseline;margin-bottom:12px;flex-wrap:wrap}
.cnum{
  font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;
  color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:2px 7px;
}
.chead h3{margin:0;font-family:var(--sans);font-size:15.5px;font-weight:600;line-height:1.45}
.cpages{font-size:12px;color:var(--ink-3);font-family:var(--mono)}

/* ── 소단원 카드 ────────────────────────────────────────── */
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(296px,1fr));gap:10px}
.topic{
  border:1px solid var(--line);border-radius:11px;background:var(--surface-2);
  padding:13px 14px;display:flex;flex-direction:column;gap:11px;
}
.topic.hit{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.tline{display:flex;gap:9px;align-items:flex-start}
.tcode{
  font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--ink-3);
  padding-top:3px;letter-spacing:.02em;
}
.ttitle{flex:1;min-width:0;font-size:14.5px;font-weight:600;line-height:1.45;margin:0}
.tsub{margin:3px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.chip{
  font-size:10.5px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap;
  letter-spacing:.02em;align-self:flex-start;
}
.chip.ready{background:var(--accent-soft);color:var(--accent)}
.chip.draft{background:var(--quiz-soft);color:var(--quiz)}
.chip.none{background:var(--line-2);color:var(--ink-3)}
.tbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.btn{
  border:1px solid var(--line);background:var(--surface);border-radius:8px;
  padding:7px 11px;font-size:12.5px;font-weight:500;display:inline-flex;gap:5px;align-items:center;
  transition:background .15s,border-color .15s,color .15s;
}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--accent-deep);border-color:var(--accent-deep);color:#fff}
.btn.quiz{background:var(--quiz-soft);border-color:transparent;color:var(--quiz);font-weight:600}
.btn.quiz:hover:not(:disabled){border-color:var(--quiz);color:var(--quiz)}
.score{
  margin-left:auto;font-family:var(--mono);font-size:11.5px;font-weight:600;
  color:var(--ink-2);align-self:center;font-variant-numeric:tabular-nums;
}

.empty{text-align:center;color:var(--ink-2);padding:48px 0;font-size:14px}

/* ── 모달 ───────────────────────────────────────────────── */
.modal[hidden]{display:none!important}
.modal{
  position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(12,18,22,.5);backdrop-filter:blur(3px);
  padding:0;
}
@media (min-width:600px){.modal{align-items:center;padding:24px}}
.sheet{
  background:var(--surface);width:100%;max-width:660px;max-height:92vh;
  border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 20px 60px -20px rgba(0,0,0,.5);
  animation:rise .22s ease-out;
}
@media (min-width:600px){.sheet{border-radius:16px;max-height:86vh}}
@keyframes rise{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
.sheet.wide{max-width:1000px;height:92vh}
@media (min-width:600px){.sheet.wide{height:86vh}}
.shead{
  display:flex;gap:12px;align-items:flex-start;
  padding:16px 18px;border-bottom:1px solid var(--line);flex:0 0 auto;
}
.shead .scode{font-family:var(--mono);font-size:11px;color:var(--ink-3);display:block;margin-bottom:2px}
.shead h4{margin:0;font-size:16px;font-weight:600;line-height:1.4}
.sclose{
  border:none;background:var(--surface-2);border-radius:8px;width:32px;height:32px;
  display:grid;place-items:center;flex:0 0 auto;color:var(--ink-2);
}
.sclose:hover{color:var(--ink)}
.sbody{overflow-y:auto;padding:18px;flex:1 1 auto;-webkit-overflow-scrolling:touch}
.sbody.flush{padding:0}
.sbody iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.sfoot{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding:14px 18px;border-top:1px solid var(--line);flex:0 0 auto;background:var(--surface);
}

/* ── 퀴즈 ───────────────────────────────────────────────── */
.q{padding-bottom:18px;margin-bottom:18px;border-bottom:1px dashed var(--line)}
.q:last-of-type{border-bottom:none;margin-bottom:6px}
.qhead{display:flex;gap:8px;align-items:baseline;margin-bottom:10px}
.qnum{
  font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent);
  background:var(--accent-soft);border-radius:5px;padding:2px 7px;flex:0 0 auto;
}
.qtype{font-size:11px;color:var(--ink-3);margin-left:auto;flex:0 0 auto}
.qtext{margin:0;font-size:14.5px;font-weight:500;line-height:1.6;flex:1 1 100%}
.qpassage{
  font-family:var(--serif);font-size:13.5px;line-height:1.85;
  background:var(--surface-2);border-left:3px solid var(--accent);
  padding:11px 13px;border-radius:0 8px 8px 0;margin:10px 0;color:var(--ink);
}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:11px}
.opt{
  display:flex;gap:9px;align-items:flex-start;
  border:1px solid var(--line);border-radius:9px;padding:9px 11px;
  background:var(--surface);cursor:pointer;font-size:14px;line-height:1.5;
  transition:border-color .12s,background .12s;
}
.opt:hover{border-color:var(--accent)}
.opt input{margin:4px 0 0;accent-color:var(--accent);flex:0 0 auto}
.opt .okey{font-family:var(--mono);font-size:12px;color:var(--ink-3);flex:0 0 auto;padding-top:1px}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--no);background:var(--no-soft)}
.shortin{
  width:100%;margin-top:11px;padding:10px 12px;border:1px solid var(--line);
  border-radius:9px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;
}
.shortin.correct{border-color:var(--ok);background:var(--ok-soft)}
.shortin.wrong{border-color:var(--no);background:var(--no-soft)}
.feedback{margin-top:11px;border-radius:9px;padding:10px 12px;font-size:13.5px;line-height:1.65}
.feedback.correct{background:var(--ok-soft);color:var(--ok)}
.feedback.wrong{background:var(--no-soft);color:var(--no)}
.feedback b{font-weight:600}
.feedback .exp{display:block;margin-top:5px;color:var(--ink-2);font-weight:400}
.result{
  display:flex;gap:10px;align-items:baseline;font-size:14px;font-weight:600;margin-right:auto;
}
.result .big{font-family:var(--mono);font-size:19px;color:var(--accent);font-variant-numeric:tabular-nums}
.result .msg{font-weight:400;color:var(--ink-2);font-size:13px}
.hint{font-size:12.5px;color:var(--ink-3);margin-right:auto}

.foot{
  border-top:1px solid var(--line);color:var(--ink-3);font-size:12.5px;
  padding-block:20px 30px;
}
.foot code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:4px;color:var(--ink-2)}
</style>

<header class="hero">
  <div class="wrap hero-in">
    <p class="eyebrow">2026학년도 · 천재교육 『인문학과 윤리』</p>
    <h1>인문학과 윤리로 빠져보시겠습니까?</h1>
    <p>6개 대단원 · 12개 중단원 · 24개 소단원. 단원을 펼쳐 학습지를 열고, 배운 자리에서 바로 형성평가를 풀어 봅니다.</p>
    <div class="stats" id="stats"></div>
  </div>
</header>

<div class="toolbar">
  <div class="wrap toolbar-in">
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="q" type="search" placeholder="소단원·사상가·키워드 검색 (예: 격몽요결, 에피쿠로스)" autocomplete="off">
    </label>
    <button class="tbtn" id="expandAll" type="button">전체 펼치기</button>
    <button class="tbtn" id="collapseAll" type="button">접기</button>
  </div>
</div>

<main class="wrap">
  <div id="units"></div>
  <p class="empty" id="empty" hidden>검색 결과가 없습니다.</p>
</main>

<footer class="wrap foot">
  <p>학습지와 형성평가 내용은 <code>curriculumData</code> 한 곳에서만 수정하면 화면 전체에 반영됩니다. 자세한 사용법은 소스 맨 위 주석을 보세요.</p>
</footer>

<!-- 형성평가 / 미리보기 공용 모달 -->
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="sheet" id="sheet">
    <div class="shead">
      <div style="flex:1;min-width:0">
        <span class="scode" id="modalCode"></span>
        <h4 id="modalTitle"></h4>
      </div>
      <button class="sclose" id="modalClose" type="button" aria-label="닫기">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <div class="sbody" id="modalBody"></div>
    <div class="sfoot" id="modalFoot"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   ▣ 선생님이 고치실 곳은 여기 하나뿐입니다 — curriculumData
   ═══════════════════════════════════════════════════════════════════════════

   [구조]
   대단원 { unitId, roman, title, blurb, chapters:[ 중단원 ] }
     중단원 { chapterId, title, pages, topics:[ 소단원 ] }
       소단원 { topicId, title, sub, pages, worksheetUrl, status, quiz:[ 문항 ] }

   [소단원 필드]
   topicId       "1-1-1" 형식. 화면에 코드로 표시됩니다.
   title         소단원 제목
   sub           한 줄 설명 (비워도 됩니다: "")
   pages         교과서 쪽수 (비워도 됩니다: "")
   worksheetUrl  학습지 HTML 주소. 같은 폴더면 "./sheets/1-1-1.html",

/* ═══════════════════════════════════════════════════════════════════════════
   여기서부터는 화면을 그리는 코드입니다. 보통은 손대지 않으셔도 됩니다.
   ═══════════════════════════════════════════════════════════════════════════ */

const STATUS = { ready:["완성","ready"], draft:["제작 중","draft"], none:["미제작","none"] };
const STORE = "iywy-scores-v1";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* 문항 본문은 <b> 강조를 허용하므로 esc를 거치지 않습니다 — 선생님이 직접 쓰시는 내용입니다. */
const norm = s => String(s ?? "").toLowerCase().replace(/\s+/g,"").replace(/[.,·'"()（）]/g,"");

let scores = {};
try { scores = JSON.parse(localStorage.getItem(STORE) || "{}") || {}; } catch (e) { scores = {}; }
function saveScore(id, got, total){
  scores[id] = { got, total };
  try { localStorage.setItem(STORE, JSON.stringify(scores)); } catch (e) {}
}

const allTopics = curriculumData.flatMap(u => u.chapters.flatMap(c =>
  c.topics.map(t => ({ ...t, unit:u, chapter:c }))
));
const byId = Object.fromEntries(allTopics.map(t => [t.topicId, t]));

/* ── 상단 요약 ─────────────────────────────────────────── */
function renderStats(){
  const ready = allTopics.filter(t => t.status === "ready").length;
  const quizzed = allTopics.filter(t => t.quiz && t.quiz.length).length;
  const done = allTopics.filter(t => scores[t.topicId]).length;
  document.getElementById("stats").innerHTML = `
    <span class="stat">소단원 <b>${allTopics.length}</b></span>
    <span class="stat">학습지 완성 <b>${ready}</b> / ${allTopics.length}</span>
    <span class="stat">형성평가 준비 <b>${quizzed}</b></span>
    <span class="stat">내가 푼 평가 <b>${done}</b></span>`;
}

/* ── 본문 ──────────────────────────────────────────────── */
function topicCard(t){
  const [label, cls] = STATUS[t.status] || STATUS.none;
  const hasSheet = !!t.worksheetUrl;
  const hasQuiz = !!(t.quiz && t.quiz.length);
  const s = scores[t.topicId];
  return `
  <article class="topic" data-topic="${esc(t.topicId)}" data-search="${esc((t.topicId+" "+t.title+" "+(t.sub||"")+" "+t.chapter.title+" "+t.unit.title).toLowerCase())}">
    <div class="tline">
      <span class="tcode">${esc(t.topicId)}</span>
      <div style="flex:1;min-width:0">
        <h4 class="ttitle">${esc(t.title)}</h4>
        ${t.sub ? `<p class="tsub">${esc(t.sub)}</p>` : ""}
        ${t.pages ? `<p class="tsub" style="font-family:var(--mono);font-size:11.5px">${esc(t.pages)}</p>` : ""}
      </div>
      <span class="chip ${cls}">${label}</span>
    </div>
    <div class="tbar">
      <a class="btn primary" ${hasSheet ? `href="${esc(t.worksheetUrl)}" target="_blank" rel="noopener"` : `aria-disabled="true" style="opacity:.45;pointer-events:none"`}>
        학습지 열기${hasSheet ? " ↗" : " (준비 중)"}
      </a>
      <button class="btn" type="button" data-act="copy" data-topic="${esc(t.topicId)}" ${hasSheet ? "" : "disabled"} title="학습지 주소를 복사합니다">주소 복사</button>
      <button class="btn quiz" type="button" data-act="quiz" data-topic="${esc(t.topicId)}" ${hasQuiz ? "" : "disabled"}>
        형성평가 풀어보기${hasQuiz ? ` (${t.quiz.length})` : ""}
      </button>
      ${s ? `<span class="score">${s.got}/${s.total}</span>` : ""}
    </div>
  </article>`;
}

function render(){
  document.getElementById("units").innerHTML = curriculumData.map((u, i) => `
    <details class="unit" data-unit="${esc(u.unitId)}" ${i === 0 ? "open" : ""}>
      <summary>
        <span class="unum">${esc(u.roman)}</span>
        <div class="uhead">
          <h2>${esc(u.title)}</h2>
          <p class="umeta">${u.blurb ? esc(u.blurb) + " · " : ""}중단원 ${u.chapters.length} · 소단원 ${u.chapters.reduce((n,c)=>n+c.topics.length,0)}</p>
        </div>
        <svg class="uchev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </summary>
      <div class="ubody">
        ${u.chapters.map(c => `
          <section class="chapter">
            <div class="chead">
              <span class="cnum">${esc(c.chapterId)}</span>
              <h3>${esc(c.title)}</h3>
              ${c.pages ? `<span class="cpages">${esc(c.pages)}</span>` : ""}
            </div>
            <div class="topics">${c.topics.map(t => topicCard(byId[t.topicId])).join("")}</div>
          </section>`).join("")}
      </div>
    </details>`).join("");
  renderStats();
}

/* ── 검색 ──────────────────────────────────────────────── */
document.getElementById("q").addEventListener("input", e => {
  const term = e.target.value.trim().toLowerCase();
  let hits = 0;
  document.querySelectorAll(".unit").forEach(unit => {
    let unitHits = 0;
    unit.querySelectorAll(".topic").forEach(card => {
      const match = !term || card.dataset.search.includes(term);
      card.hidden = !match;
      card.classList.toggle("hit", !!term && match);
      if (match) unitHits++;
    });
    unit.querySelectorAll(".chapter").forEach(ch => {
      ch.hidden = ![...ch.querySelectorAll(".topic")].some(c => !c.hidden);
    });
    unit.hidden = term ? unitHits === 0 : false;
    if (term && unitHits) unit.open = true;
    hits += unitHits;
  });
  document.getElementById("empty").hidden = !(term && hits === 0);
});

document.getElementById("expandAll").onclick = () =>
  document.querySelectorAll(".unit").forEach(d => d.open = true);
document.getElementById("collapseAll").onclick = () =>
  document.querySelectorAll(".unit").forEach(d => d.open = false);

/* ── 모달 ──────────────────────────────────────────────── */
const modal = document.getElementById("modal");
const sheet = document.getElementById("sheet");
const mBody = document.getElementById("modalBody");
const mFoot = document.getElementById("modalFoot");
let lastFocus = null;

function openModal({ code, title, bodyHTML, footHTML, wide = false, flush = false }){
  lastFocus = document.activeElement;
  document.getElementById("modalCode").textContent = code;
  document.getElementById("modalTitle").textContent = title;
  mBody.innerHTML = bodyHTML;
  mBody.classList.toggle("flush", flush);
  mFoot.innerHTML = footHTML;
  mFoot.hidden = !footHTML;
  sheet.classList.toggle("wide", wide);
  modal.hidden = false;
  document.body.style.overflow = "hidden";
  document.getElementById("modalClose").focus();
}
function closeModal(){
  modal.hidden = true;
  mBody.innerHTML = "";
  mFoot.innerHTML = "";
  document.body.style.overflow = "";
  if (lastFocus) lastFocus.focus();
}
document.getElementById("modalClose").onclick = closeModal;
modal.addEventListener("mousedown", e => { if (e.target === modal) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !modal.hidden) closeModal(); });

/* ── 형성평가 ──────────────────────────────────────────── */
let current = null;

function quizHTML(t){
  return t.quiz.map((item, i) => {
    const head = `
      <div class="qhead">
        <span class="qnum">${i + 1}</span>
        <span class="qtype">${item.type === "short" ? "단답형" : "객관식"}</span>
      </div>
      <p class="qtext">${item.q}</p>
      ${item.passage ? `<div class="qpassage">${esc(item.passage).replace(/\n/g, "<br>")}</div>` : ""}`;
    const body = item.type === "short"
      ? `<input class="shortin" type="text" id="q${i}" name="q${i}" autocomplete="off" placeholder="답을 입력하세요">`
      : `<div class="opts">${item.options.map((o, k) => `
          <label class="opt" data-opt="${k}">
            <input type="radio" name="q${i}" value="${k}" id="q${i}o${k}">
            <span class="okey">${"①②③④⑤"[k] || (k + 1)}</span>
            <span>${o}</span>
          </label>`).join("")}</div>`;
    return `<div class="q" data-q="${i}">${head}${body}<div class="feedback" hidden></div></div>`;
  }).join("");
}

function openQuiz(id){
  const t = byId[id];
  if (!t || !t.quiz.length) return;
  current = t;
  openModal({
    code: `${t.topicId} · ${t.chapter.title}`,
    title: `형성평가 — ${t.title}`,
    bodyHTML: `<form id="quizForm" novalidate>${quizHTML(t)}</form>`,
    footHTML: `<span class="hint">${t.quiz.length}문항 · 제출하면 바로 채점됩니다</span>
               <button class="btn primary" type="button" id="grade">제출하고 채점</button>`
  });

  document.getElementById("grade").onclick = grade;
}

/* 보기를 고르면 그 보기만 강조 (모달 본문에 한 번만 걸어 둡니다) */
mBody.addEventListener("change", e => {
  const label = e.target.closest(".opt");
  if (!label) return;
  label.closest(".opts").querySelectorAll(".opt").forEach(o => o.classList.remove("picked"));
  label.classList.add("picked");
});

function grade(){
  const t = current;
  let got = 0;
  t.quiz.forEach((item, i) => {
    const q = mBody.querySelector(`.q[data-q="${i}"]`);
    const fb = q.querySelector(".feedback");
    let ok = false, shown = "";

    if (item.type === "short") {
      const input = q.querySelector(".shortin");
      input.readOnly = true;
      const accepted = Array.isArray(item.answer) ? item.answer : [item.answer];
      ok = accepted.some(a => norm(a) && norm(a) === norm(input.value));
      input.classList.add(ok ? "correct" : "wrong");
      shown = accepted[0];
    } else {
      const picked = q.querySelector("input[type=radio]:checked");
      ok = picked && Number(picked.value) === item.answer;
      q.querySelectorAll(".opt").forEach(label => {
        const k = Number(label.dataset.opt);
        label.querySelector("input").disabled = true;
        label.classList.remove("picked");
        if (k === item.answer) label.classList.add("correct");
        else if (picked && k === Number(picked.value)) label.classList.add("wrong");
      });
      shown = `${"①②③④⑤"[item.answer] || item.answer + 1} ${item.options[item.answer].replace(/<[^>]+>/g, "")}`;
    }

    if (ok) got++;
    fb.hidden = false;
    fb.className = "feedback " + (ok ? "correct" : "wrong");
    fb.innerHTML = `<b>${ok ? "정답입니다" : "정답: " + esc(shown)}</b>${item.explain ? `<span class="exp">${esc(item.explain)}</span>` : ""}`;
  });

  saveScore(t.topicId, got, t.quiz.length);
  const msg = got === t.quiz.length ? "모두 맞혔습니다."
            : got === 0 ? "해설을 읽고 다시 풀어 보세요."
            : "틀린 문항의 해설을 확인해 보세요.";
  mFoot.innerHTML = `
    <span class="result"><span class="big">${got} / ${t.quiz.length}</span><span class="msg">${msg}</span></span>
    <button class="btn" type="button" id="reset">다시 풀기</button>
    <button class="btn primary" type="button" id="done">닫기</button>`;
  document.getElementById("reset").onclick = () => openQuiz(t.topicId);
  document.getElementById("done").onclick = () => { closeModal(); render(); };
  mBody.scrollTop = 0;
  render();
  /* render()가 카드를 다시 그리므로 모달은 그대로 두고 점수 칩만 갱신됩니다 */
}

/* ── 학습지 주소 복사 ───────────────────────────────────
   이 페이지는 보안 상자(iframe) 안에서 돌기 때문에, 브라우저가
   '새 탭 열기'를 막아 버튼이 안 먹는 것처럼 보일 때가 있습니다.
   그럴 때 쓰시라고 주소를 복사해 주는 버튼을 함께 두었습니다.   */
function copyUrl(id, btn){
  const t = byId[id];
  if (!t || !t.worksheetUrl) return;
  const done = ok => {
    const old = btn.textContent;
    btn.textContent = ok ? "복사됨 ✓" : "복사 실패";
    setTimeout(() => { btn.textContent = old; }, 1600);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t.worksheetUrl).then(() => done(true), () => fallback());
  } else fallback();

  function fallback(){
    /* 클립보드가 막혀 있으면 주소를 띄워 직접 복사하시게 합니다 */
    openModal({
      code: `${t.topicId} · ${t.chapter.title}`,
      title: `${t.title} — 학습지 주소`,
      bodyHTML: `<p style="margin:0 0 12px;font-size:13.5px;color:var(--ink-2)">
                   아래 주소를 길게 눌러 복사한 뒤 주소창에 붙여 넣으세요.</p>
                 <input class="shortin" id="urlBox" type="text" readonly value="${esc(t.worksheetUrl)}" style="margin-top:0">`,
      footHTML: `<a class="btn primary" href="${esc(t.worksheetUrl)}" target="_blank" rel="noopener">새 탭에서 열기 ↗</a>`
    });
    const box = document.getElementById("urlBox");
    if (box) { box.focus(); box.select(); }
    done(false);
  }
}

/* ── 이벤트 위임 ───────────────────────────────────────── */
document.getElementById("units").addEventListener("click", e => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  if (btn.dataset.act === "quiz") openQuiz(btn.dataset.topic);
  if (btn.dataset.act === "copy") copyUrl(btn.dataset.topic, btn);
});

render();
</script>
